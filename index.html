<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Financeira - Entradas e Saídas</title>
    <!-- Biblioteca para gerar arquivos .xlsx reais no navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #FFFFFF;
            --fg: #000000;
            --gray-light: #F4F4F4;
            --gray-border: #CCCCCC;
            --green: #2e7d32;
            --red: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        header {
            border-bottom: 3px solid var(--fg);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        /* Cartão de Resumo Financeiro */
        .summary-card {
            background: var(--fg);
            color: var(--bg);
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .summary-main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
        }

        .summary-item label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            display: block;
            margin-bottom: 4px;
        }

        .summary-item span {
            font-size: 20px;
            font-weight: bold;
        }

        .summary-item .valor-entrada { color: #81c784; }
        .summary-item .valor-saida { color: #e57373; }
        .summary-item .valor-saldo { color: #ffffff; }

        .accounts-breakdown {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .account-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr 1.2fr 1.5fr auto;
            gap: 10px;
            margin-bottom: 25px;
        }

        input, select {
            padding: 12px;
            font-size: 14px;
            border: 2px solid var(--fg);
            background: var(--bg);
            color: var(--fg);
            outline: none;
            border-radius: 2px;
        }

        input:focus, select:focus {
            background-color: var(--gray-light);
        }

        button {
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--fg);
            background: var(--fg);
            color: var(--bg);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
            border-radius: 2px;
        }

        button:hover {
            background: var(--bg);
            color: var(--fg);
        }

        /* Tabela */
        .table-container {
            max-height: 350px;
            overflow-y: auto;
            border: 2px solid var(--fg);
            margin-bottom: 20px;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: var(--gray-light);
        }
        .table-container::-webkit-scrollbar-thumb {
            background: var(--fg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--fg);
            color: var(--bg);
            padding: 12px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            border-bottom: 1px solid var(--gray-border);
            padding: 12px;
            font-size: 14px;
        }

        tr:nth-child(even) {
            background-color: var(--gray-light);
        }

        /* Badges e Cores */
        .badge-tipo {
            display: inline-block;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 2px;
            color: #fff;
        }

        .badge-entrada { background-color: var(--green); }
        .badge-saida { background-color: var(--red); }

        .texto-entrada { color: var(--green); font-weight: bold; }
        .texto-saida { color: var(--red); font-weight: bold; }

        .badge-conta {
            display: inline-block;
            background: var(--gray-light);
            border: 1px solid var(--fg);
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 2px;
        }

        .btn-remove {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--fg);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 2px;
        }

        .btn-remove:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .btn-export {
            width: 100%;
            padding: 15px;
            font-size: 15px;
        }

        .btn-clear {
            background: transparent;
            color: var(--fg);
            padding: 15px;
            font-size: 14px;
        }

        .btn-clear:hover {
            background: #ff0000;
            color: #ffffff;
            border-color: #ff0000;
        }

        @media (max-width: 768px) {
            .summary-main {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .actions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Fluxo Financeiro</h1>
        </header>

        <!-- Painel Resumo -->
        <div class="summary-card">
            <div class="summary-main">
                <div class="summary-item">
                    <label>Total Entradas (+)</label>
                    <span id="totalEntradasDisplay" class="valor-entrada">R$ 0,00</span>
                </div>
                <div class="summary-item">
                    <label>Total A Pagar (-)</label>
                    <span id="totalSaidasDisplay" class="valor-saida">R$ 0,00</span>
                </div>
                <div class="summary-item">
                    <label>Saldo Resultante</label>
                    <span id="saldoDisplay" class="valor-saldo">R$ 0,00</span>
                </div>
            </div>
            <!-- Totais detalhados por conta -->
            <div>
                <label style="font-size: 10px; text-transform: uppercase; opacity: 0.7; margin-bottom: 5px; display: block;">Saldos Líquidos por Conta:</label>
                <div class="accounts-breakdown" id="resumoContas">
                    <!-- Resumo inserido via JavaScript -->
                </div>
            </div>
        </div>

        <!-- Formulário de Inserção -->
        <div class="form-grid">
            <input type="date" id="data">
            
            <select id="tipo">
                <option value="entrada"> Entrada (+)</option>
                <option value="saida" selected> A Pagar (-)</option>
            </select>

            <select id="conta">
                <option value="" disabled selected>Selecione a Conta</option>
                <option value="Itaú">Itaú</option>
                <option value="Bradesco">Bradesco</option>
                <option value="Banco do Brasil">Banco do Brasil</option>
                <option value="Santander">Santander</option>
                <option value="Caixa">Caixa</option>
                <option value="Nubank">Nubank</option>
                <option value="Inter">Inter</option>
                <option value="Dinheiro/Caixa">Dinheiro/Caixa</option>
                <option value="Outra">Outra Conta</option>
            </select>

            <input type="number" id="valor" placeholder="Valor (R$)" step="0.01">
            <input type="text" id="descricao" placeholder="Descrição (ex: Luz, Fornecedor)">
            <button onclick="adicionarLancamento()">Adicionar</button>
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">Data</th>
                        <th style="width: 15%;">Tipo</th>
                        <th style="width: 18%;">Conta</th>
                        <th style="width: 18%;">Valor</th>
                        <th style="width: 24%;">Descrição</th>
                        <th style="width: 10%; text-align: center;">Ação</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- Registros inseridos via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Botões de Ação -->
        <div class="actions-grid">
            <button class="btn-export" onclick="exportarExcel()">Exportar Relatório (.xlsx)</button>
            <button class="btn-clear" onclick="limparTudo()">Limpar Tudo</button>
        </div>
    </div>

    <script>
        // Carrega registros salvos no localStorage
        let lancamentos = JSON.parse(localStorage.getItem('financeiro_registros')) || [];

        document.getElementById('data').valueAsDate = new Date();

        function salvarNoDispositivo() {
            localStorage.setItem('financeiro_registros', JSON.stringify(lancamentos));
        }

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        }

        function formatarDataBR(dataISO) {
            const [ano, mes, dia] = dataISO.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function adicionarLancamento() {
            const dataInput = document.getElementById('data');
            const tipoInput = document.getElementById('tipo');
            const contaInput = document.getElementById('conta');
            const valorInput = document.getElementById('valor');
            const descInput = document.getElementById('descricao');

            if (!dataInput.value || !valorInput.value || !contaInput.value) {
                alert("Por favor, preencha a Data, a Conta e o Valor.");
                return;
            }

            const valorNum = parseFloat(valorInput.value);
            if (valorNum <= 0 || isNaN(valorNum)) {
                alert("Por favor, informe um valor maior que zero.");
                return;
            }

            const novoRegistro = {
                id: Date.now(),
                dataISO: dataInput.value,
                dataFormatada: formatarDataBR(dataInput.value),
                tipo: tipoInput.value, // 'entrada' ou 'saida'
                conta: contaInput.value,
                valor: valorNum,
                descricao: descInput.value.trim() || 'Sem descrição'
            };

            lancamentos.push(novoRegistro);
            salvarNoDispositivo();

            valorInput.value = '';
            descInput.value = '';
            valorInput.focus();

            atualizarInterface();
        }

        function removerLancamento(id) {
            lancamentos = lancamentos.filter(item => item.id !== id);
            salvarNoDispositivo();
            atualizarInterface();
        }

        function limparTudo() {
            if (lancamentos.length === 0) return;

            if (confirm("Tem certeza que deseja apagar todos os registros acumulados?")) {
                lancamentos = [];
                salvarNoDispositivo();
                atualizarInterface();
            }
        }

        function atualizarInterface() {
            const corpo = document.getElementById('corpoTabela');
            const resumoContasContainer = document.getElementById('resumoContas');
            corpo.innerHTML = '';
            resumoContasContainer.innerHTML = '';

            let totalEntradas = 0;
            let totalSaidas = 0;
            const balancoPorConta = {};

            lancamentos.forEach(item => {
                // Cálculo de totais
                if (item.tipo === 'entrada') {
                    totalEntradas += item.valor;
                    balancoPorConta[item.conta] = (balancoPorConta[item.conta] || 0) + item.valor;
                } else {
                    totalSaidas += item.valor;
                    balancoPorConta[item.conta] = (balancoPorConta[item.conta] || 0) - item.valor;
                }

                // Renderiza linha da tabela
                const tr = document.createElement('tr');
                const ehEntrada = item.tipo === 'entrada';
                const sinal = ehEntrada ? '+' : '-';
                const classeTexto = ehEntrada ? 'texto-entrada' : 'texto-saida';
                const badgeTipoClass = ehEntrada ? 'badge-entrada' : 'badge-saida';
                const tipoTexto = ehEntrada ? 'Entrada' : 'A Pagar';

                tr.innerHTML = `
                    <td>${item.dataFormatada}</td>
                    <td><span class="badge-tipo ${badgeTipoClass}">${tipoTexto}</span></td>
                    <td><span class="badge-conta">${item.conta}</span></td>
                    <td class="${classeTexto}">${sinal} ${formatarMoeda(item.valor)}</td>
                    <td>${item.descricao}</td>
                    <td style="text-align: center;">
                        <button class="btn-remove" onclick="removerLancamento(${item.id})">✕</button>
                    </td>
                `;
                corpo.appendChild(tr);
            });

            // Atualização dos cards do topo
            const saldoTotal = totalEntradas - totalSaidas;

            document.getElementById('totalEntradasDisplay').innerText = formatarMoeda(totalEntradas);
            document.getElementById('totalSaidasDisplay').innerText = formatarMoeda(totalSaidas);
            
            const saldoEl = document.getElementById('saldoDisplay');
            saldoEl.innerText = formatarMoeda(saldoTotal);
            saldoEl.style.color = saldoTotal >= 0 ? '#81c784' : '#e57373';

            // Renderização do resumo de contas
            const contas = Object.keys(balancoPorConta);
            if (contas.length === 0) {
                resumoContasContainer.innerHTML = '<span style="font-size: 12px; opacity: 0.6;">Nenhum lançamento registrado.</span>';
            } else {
                contas.forEach(c => {
                    const badge = document.createElement('div');
                    badge.className = 'account-badge';
                    const valorConta = balancoPorConta[c];
                    const corSinal = valorConta >= 0 ? '#81c784' : '#e57373';
                    badge.innerHTML = `${c}: <strong style="color: ${corSinal}">${formatarMoeda(valorConta)}</strong>`;
                    resumoContasContainer.appendChild(badge);
                });
            }
        }

        function exportarExcel() {
            if (lancamentos.length === 0) {
                alert("Adicione ao menos um lançamento para exportar.");
                return;
            }

            const dadosExcel = [
                ["Data", "Tipo", "Conta", "Valor (R$)", "Descrição"]
            ];

            let totalEntradas = 0;
            let totalSaidas = 0;

            lancamentos.forEach(item => {
                const tipoTexto = item.tipo === 'entrada' ? 'Entrada' : 'Saída/A Pagar';
                const valorAjustado = item.tipo === 'entrada' ? item.valor : -item.valor;
                
                if (item.tipo === 'entrada') totalEntradas += item.valor;
                else totalSaidas += item.valor;

                dadosExcel.push([
                    item.dataFormatada,
                    tipoTexto,
                    item.conta,
                    valorAjustado,
                    item.descricao
                ]);
            });

            // Linhas de Totais no final do arquivo
            dadosExcel.push([]);
            dadosExcel.push(["RESUMO", "", "", "", ""]);
            dadosExcel.push(["Total Entradas", "", totalEntradas, "", ""]);
            dadosExcel.push(["Total Saídas", "", totalSaidas, "", ""]);
            dadosExcel.push(["SALDO LÍQUIDO", "", (totalEntradas - totalSaidas), "", ""]);

            const ws = XLSX.utils.aoa_to_sheet(dadosExcel);

            ws['!cols'] = [
                { wch: 15 },
                { wch: 15 },
                { wch: 18 },
                { wch: 18 },
                { wch: 30 }
            ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Fluxo Financeiro");

            XLSX.writeFile(wb, "Relatorio_Financeiro.xlsx");
        }

        // Renderiza na inicialização
        atualizarInterface();
    </script>
</body>
</html>
